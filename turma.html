<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turma — Mural UEG</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-int">
    <a href="turmas.html" class="marca">
      <img src="img/logo-ueg-header.png" alt="UEG" class="marca-logo">
      <span class="marca-txt">Mural UEG<small>Câmpus Itaberaí</small></span>
    </a>
    <div class="topo-dir">
      <a href="tarefas.html">Tarefas</a>
      <a href="vitrine.html">Todas as turmas</a>
      <a href="perfil.html">Perfil</a>
      <span class="topo-nome" id="topoNome"></span>
      <span class="selo" id="topoSelo"></span>
      <a href="#" id="btnSair">Sair</a>
    </div>
  </div>
</header>

<main class="pagina">
  <a class="voltar" href="turmas.html">Voltar para minhas turmas</a>

  <div class="cabecalho">
    <h1 id="turmaNome">Carregando...</h1>
    <p id="turmaInfo"></p>
  </div>

  <div id="avisoTopo" class="aviso oculto"></div>

  <div class="colunas">
    <section>
      <!-- só professor vê -->
      <div class="bloco oculto" id="painelPublicar">
        <h2>Nova postagem</h2>
        <div id="avisoPost" class="aviso oculto"></div>
        <form id="formPost">
          <div class="campo-duplo">
            <div class="campo">
              <label for="p_titulo">Título</label>
              <input type="text" id="p_titulo" required placeholder="Entrega do trabalho 2">
            </div>
            <div class="campo">
              <label for="p_tipo">Tipo</label>
              <select id="p_tipo">
                <option value="aviso">Aviso</option>
                <option value="atividade">Atividade</option>
                <option value="material">Material</option>
                <option value="duvida">Discussão</option>
              </select>
            </div>
          </div>
          <div class="campo">
            <label for="p_conteudo">Mensagem</label>
            <textarea id="p_conteudo" required placeholder="Escreva o recado para a turma..."></textarea>
          </div>
          <div class="campo oculto" id="campoDataEntrega">
            <label for="p_data_entrega">Data de entrega</label>
            <input type="date" id="p_data_entrega">
          </div>
          <div class="campo">
            <label class="marcar"><input type="checkbox" id="p_fixado"> Fixar no topo do mural</label>
          </div>
          <button type="submit" id="btnPublicar">Publicar</button>
        </form>
      </div>

      <div id="mural" class="mural">
        <p class="carregando">Carregando o mural...</p>
      </div>
    </section>

    <aside>
      <div class="bloco oculto" id="painelPedidos">
        <h2>Pedidos de entrada</h2>
        <ul class="alunos" id="listaPedidos">
          <li class="carregando">Carregando pedidos...</li>
        </ul>
      </div>

      <div class="bloco" id="painelLateral">
        <h2>Sobre a turma</h2>
        <div id="lateralInfo" class="carregando">...</div>
      </div>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/comum.js"></script>
<script src="js/turma.js"></script>
</body>
</html>
