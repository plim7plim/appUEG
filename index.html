<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('tema');if(t==='escuro'||t==='claro')document.documentElement.dataset.tema=t;})();</script>
<title>Mural UEG Itaberaí</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<main class="entrada">
  <div class="entrada-marca">
    <img src="img/logo-ueg.png" alt="UEG — Universidade Estadual de Goiás" class="logo-entrada">
    <h1>Mural UEG</h1>
    <p>Câmpus Itaberaí — avisos e conversas das suas turmas</p>
  </div>

  <div class="bloco">
    <div class="abas">
      <button type="button" id="abaEntrar" class="ativa">Entrar</button>
      <button type="button" id="abaCriar">Criar conta</button>
    </div>

    <div id="aviso" class="aviso oculto"></div>

    <!-- ENTRAR -->
    <form id="formEntrar">
      <div class="campo">
        <label for="e_email">E-mail</label>
        <input type="email" id="e_email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="e_senha">Senha</label>
        <input type="password" id="e_senha" required autocomplete="current-password">
      </div>
      <p style="margin:-6px 0 14px;text-align:right">
        <a href="#" id="linkEsqueciSenha" style="font-size:.85rem">Esqueceu a senha?</a>
      </p>
      <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <!-- CRIAR CONTA -->
    <form id="formCriar" class="oculto">
      <div class="campo">
        <label>Você é</label>
        <div class="escolha-papel">
          <label>
            <input type="radio" name="papel" value="aluno" checked>Aluno
            <small>Entra nas turmas por código</small>
          </label>
          <label>
            <input type="radio" name="papel" value="professor">Professor
            <small>Cria turmas e publica</small>
          </label>
        </div>
      </div>
      <div class="campo">
        <label for="c_nome">Nome completo</label>
        <input type="text" id="c_nome" required autocomplete="name">
      </div>
      <div class="campo">
        <label for="c_email">E-mail</label>
        <input type="email" id="c_email" required autocomplete="email">
      </div>
      <div class="campo-duplo">
        <div class="campo">
          <label for="c_senha">Senha</label>
          <input type="password" id="c_senha" required minlength="6" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="c_matricula">Matrícula (opcional)</label>
          <input type="text" id="c_matricula">
        </div>
      </div>
      <button type="submit" id="btnCriar">Criar conta</button>
    </form>
  </div>
</main>

<footer class="rodape">
  <div class="rodape-int">
    <span>Mural UEG — Câmpus Itaberaí</span>
    <span class="rodape-sep">·</span>
    <span>© <span id="rodapeAno"></span> Universidade Estadual de Goiás</span>
    <span class="rodape-sep">·</span>
    <a href="https://discord.gg/HwQqaA2BJs" target="_blank" rel="noopener" class="rodape-discord">

      Discord da Comunidade

  </div>

<script src="js/comum.js"></script>
<script src="js/login.js"></script>
</body>
</html>
