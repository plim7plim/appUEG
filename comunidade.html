<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunidade — Mural UEG</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<header class="topo">
  <div class="topo-int">
    <a href="comunidade.html" class="marca">
      <img src="img/logo-ueg-header.png" alt="UEG" class="marca-logo">
      <span class="marca-txt">Mural UEG<small>Câmpus Itaberaí</small></span>
    </a>
    <input type="checkbox" id="menuToggle" class="menu-toggle">
    <label for="menuToggle" class="menu-btn" aria-label="Abrir menu"><span></span><span></span><span></span></label>
    <div class="topo-dir">
      <a href="colegas.html">Colegas</a>
      <a href="comunidade.html" class="ativa">Comunidade</a>
      <a href="horario.html">Horário</a>
      <a href="perfil.html">Perfil</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="vitrine.html">Todas as turmas</a>
      <span class="topo-nome" id="topoNome"></span>
      <span class="selo" id="topoSelo"></span>
      <a href="#" id="btnSair">Sair</a>
    </div>
  </div>
</header>

<main class="pagina">
  <div class="cabecalho">
    <h1>Comunidade</h1>
    <p>Espaço livre pra compartilhar, comentar e curtir — de todo mundo, sem precisar de turma.</p>
  </div>

  <div class="bloco">
    <div id="avisoPublicar" class="aviso oculto"></div>
    <form id="formPublicar">
      <div class="campo">
        <textarea id="s_conteudo" required placeholder="O que você quer compartilhar com a comunidade?" maxlength="1000"></textarea>
      </div>
      <div class="campo">
        <label for="s_imagem">Imagem (opcional — é redimensionada e comprimida automaticamente)</label>
        <div class="campo-arquivo">
          <label for="s_imagem" class="btn-arquivo">Escolher imagem</label>
          <span class="arquivo-nome" id="s_imagem_nome">Nenhuma imagem escolhida</span>
          <input type="file" id="s_imagem" accept="image/*">
        </div>
      </div>
      <button type="submit" id="btnPublicarSocial">Publicar</button>
    </form>
  </div>

  <div id="feedSocial" class="mural" style="margin-top:20px">
    <p class="carregando">Carregando...</p>
  </div>
</main>

<footer class="rodape">
  <div class="rodape-int">
    <span>Mural UEG — Câmpus Itaberaí</span>
    <span class="rodape-sep">·</span>
    <span>© <span id="rodapeAno"></span> Universidade Estadual de Goiás</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/comum.js"></script>
<script src="js/comunidade.js"></script>
</body>
</html>
