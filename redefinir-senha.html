<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('tema');if(t==='escuro'||t==='claro')document.documentElement.dataset.tema=t;})();</script>
<title>Definir nova senha — Mural UEG</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<main class="entrada">
  <div class="entrada-marca">
    <img src="img/logo-ueg.png" alt="UEG — Universidade Estadual de Goiás" class="logo-entrada">
    <h1>Nova senha</h1>
    <p>Defina uma nova senha para entrar no Mural UEG</p>
  </div>

  <div class="bloco">
    <div id="aviso" class="aviso oculto"></div>

    <p id="verificando" style="color:var(--tinta-fraca);font-size:.9rem">Verificando o link...</p>

    <form id="formNovaSenha" class="oculto">
      <div class="campo">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" required minlength="6" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="confirmarSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarSenha" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" id="btnSalvarSenha">Salvar nova senha</button>
    </form>

    <div id="linkInvalido" class="oculto" style="text-align:center;margin-top:8px">
      <p style="color:var(--tinta-fraca);font-size:.9rem;margin-bottom:10px">
        Este link de redefinição é inválido ou expirou. Peça um novo link ao administrador
        ou tente entrar normalmente.
      </p>
      <a href="index.html">Voltar para o login</a>
    </div>
  </div>
</main>

<footer class="rodape">
  <div class="rodape-int">
    <span>Mural UEG — Câmpus Itaberaí</span>
    <span class="rodape-sep">·</span>
    <span>© <span id="rodapeAno"></span> Universidade Estadual de Goiás</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/comum.js"></script>
<script src="js/redefinir-senha.js"></script>
</body>
</html>
