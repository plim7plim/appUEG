<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil — Mural UEG</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/estilo.css">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<header class="topo">
  <div class="topo-int">
    <a href="comunidade.html" class="marca">
      <img src="img/logo-ueg-header.png" alt="UEG" class="marca-logo">
      <span class="marca-txt">Mural UEG<small>Câmpus Itaberaí</small></span>
    </a>
    <input type="checkbox" id="menuToggle" class="menu-toggle">
    <label for="menuToggle" class="menu-btn" aria-label="Abrir menu"><span></span><span></span><span></span></label>
    <div class="topo-dir">
      <nav class="topo-nav" aria-label="Navegação principal">
        <a href="colegas.html">Colegas</a>
        <a href="comunidade.html">Comunidade</a>
        <a href="horario.html">Horário</a>
        <a href="perfil.html" class="ativa">Perfil</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="vitrine.html">Todas as turmas</a>
      </nav>
      <div class="topo-usuario">
        <img class="topo-avatar" id="topoAvatar" alt="">
        <span class="topo-nome" id="topoNome"></span>
        <span class="selo" id="topoSelo"></span>
        <a href="#" id="btnSair" class="topo-sair">Sair</a>
      </div>
    </div>
  </div>
</header>

<main class="pagina">
  <a class="voltar" href="turmas.html">Voltar para minhas turmas</a>

  <div class="cabecalho">
    <h1>Meu perfil</h1>
    <p>Sua foto e bio aparecem aqui.</p>
  </div>

  <div class="bloco" style="max-width:640px">
    <div id="avisoPerfil" class="aviso oculto"></div>

    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
      <img id="avatarPreview" class="avatar avatar-grande" alt="Sua foto de perfil">
      <div>
        <label for="p_foto" class="btn-foto">Trocar foto</label>
        <input type="file" id="p_foto" accept="image/*" style="display:none">
        <p style="font-size:.8rem;color:var(--tinta-fraca);margin-top:6px">JPG ou PNG, até 2 MB.</p>
      </div>
    </div>

    <form id="formPerfil">
      <div class="campo">
        <label for="p_bio">Bio</label>
        <textarea id="p_bio" placeholder="Conte um pouco sobre você..." maxlength="280"></textarea>
      </div>
      <div class="campo-duplo">
        <div class="campo">
          <label for="p_ano_ingresso">Ano de ingresso</label>
          <select id="p_ano_ingresso"></select>
        </div>
        <div class="campo">
          <label for="p_linguagem">Linguagem favorita</label>
          <select id="p_linguagem"></select>
        </div>
      </div>
      <div class="campo-duplo">
        <div class="campo">
          <label for="p_github">GitHub</label>
          <input type="text" id="p_github" placeholder="github.com/seu-usuario">
        </div>
        <div class="campo">
          <label for="p_linkedin">LinkedIn</label>
          <input type="text" id="p_linkedin" placeholder="linkedin.com/in/seu-usuario">
        </div>
      </div>
      <div class="campo">
        <label>Áreas favoritas em TI</label>
        <div class="escolha-areas" id="p_areas"></div>
      </div>
      <button type="submit" id="btnSalvarPerfil">Salvar</button>
    </form>
  </div>
</main>

<footer class="rodape">
  <div class="rodape-int">
    <span>Mural UEG — Câmpus Itaberaí</span>
    <span class="rodape-sep">·</span>
    <span>© <span id="rodapeAno"></span> Universidade Estadual de Goiás</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/comum.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
